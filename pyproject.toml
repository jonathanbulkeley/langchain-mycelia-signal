[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "langchain-mycelia-signal"
dynamic = ["version"]
description = "LangChain tools for Mycelia Signal: 35 parameterised tools covering 213 of the API's 214 priced endpoints. Signed oracle data -- prices, FX, indices, derivatives, options surfaces, DeFi, compute, LLM inference, macro, prediction markets, regimes and intelligence. Automatic x402 payment. Also available as an MCP server."
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.11"
authors = [
    { name = "Jonathan Bulkeley", email = "info@myceliasignal.com" }
]
keywords = [
    "langchain", "oracle", "bitcoin", "price", "x402", "l402", "mcp",
    "ai-agents", "crypto", "attestation", "signed-data", "forex", "macro",
    "volatility", "sentiment", "funding-rate", "derivatives", "weather",
    "marine", "dlc", "defi", "oracle-intelligence", "perp-regime",
    "macro-risk", "defi-opportunity", "layer-2", "layer-3"
]
classifiers = [
    "Development Status :: 5 - Production/Stable",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Software Development :: Libraries :: Python Modules",
    "Topic :: Office/Business :: Financial",
]

dependencies = [
    "langchain-core>=0.3.0",
    "httpx>=0.27.0",
]

[project.optional-dependencies]
paid = [
    # x402 implements the exact-EVM scheme the facilitator verifies: EIP-3009
    # transferWithAuthorization, typed-data signing, nonce and validity window.
    # Before 3.0.0 this package signed payments itself and produced a structure the
    # proxy could not parse, so paid mode never settled.
    "x402>=2.9.0",
    "eth-account>=0.13.0",
]
dev = [
    "pytest>=8.0.0",
    "pytest-asyncio>=0.23.0",
]

[project.urls]
Homepage = "https://myceliasignal.com"
Documentation = "https://myceliasignal.com/docs"
Repository = "https://github.com/jonathanbulkeley/langchain-mycelia-signal"
"Bug Tracker" = "https://github.com/jonathanbulkeley/langchain-mycelia-signal/issues"

[tool.hatch.version]
# One source of truth. Declaring the version here AND in __init__ is how they drift.
path = "langchain_mycelia_signal/config.py"

[tool.hatch.build.targets.wheel]
packages = ["langchain_mycelia_signal"]

[tool.pytest.ini_options]
markers = [
    "network: hits the live /.well-known/x402 to diff every price against the proxy",
]
testpaths = ["tests"]
python_files = ["test_*.py"]
python_classes = ["Test*"]
python_functions = ["test_*"]
